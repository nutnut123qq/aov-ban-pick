name: Deploy aov-draftmind-frontend

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-aov-draftmind-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (Typecheck, Lint, Tests)
    runs-on: [self-hosted, tedo-vps]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Data Integrity Audit
        run: npm run validate:data

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test


  deploy:
    name: Build & Deploy
    needs: [quality-gate]
    runs-on: [self-hosted, tedo-vps]
    env:
      IMAGE_NAME: tedo-frontend
      DEPLOY_NAME: tedo-frontend
      KUBECONFIG: /root/.kube/config-tedo
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build, push and rollout
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || '' }}
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::12}"
          USER="${{ secrets.DOCKER_USERNAME }}"

          docker build \
            --build-arg NEXT_PUBLIC_APP_URL \
            -t "${USER}/${IMAGE_NAME}:${TAG}" \
            -t "${USER}/${IMAGE_NAME}:latest" .

          docker push "${USER}/${IMAGE_NAME}:${TAG}"
          docker push "${USER}/${IMAGE_NAME}:latest"

          k3s kubectl -n tedo set image "deploy/${DEPLOY_NAME}" \
            "${DEPLOY_NAME}=${USER}/${IMAGE_NAME}:${TAG}"
          k3s kubectl -n tedo rollout status "deploy/${DEPLOY_NAME}" --timeout=180s


